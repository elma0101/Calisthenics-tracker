<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24382e">
  <meta name="description" content="Your personal calisthenics journal. Track skills, endurance, and weighted strength in one place.">
  <title>Forma — Calisthenics journal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2324382e'/%3E%3Cpath d='M16 46V18h33M16 31h24' fill='none' stroke='%23eaa783' stroke-width='7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=inventory-22">
  <script src="core.js?v=inventory-22" defer></script>
  <script src="app.js?v=inventory-22" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#overview" aria-label="Forma home"><span class="brand-mark">f<span>↗</span></span>forma<span class="brand-dot">.</span></a>
    <div class="workspace-label">YOUR TRAINING SPACE</div>
    <nav id="navigation"></nav>
    <div class="sidebar-bottom">
      <div class="consistency-note"><span class="tiny-spark">✳</span><p>Built one<br><em>rep at a time.</em></p><span>A little better, every session.</span></div>
      <button class="nav-item" data-action="settings"><span data-icon="settings"></span>Preferences</button>
      <div class="profile"><span class="avatar" id="avatar">A</span><div><strong id="profile-name">Athlete</strong><span id="storage-status">Saved on this device</span></div><span class="status-dot"></span></div>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb"><span data-icon="grid"></span><span>Your journal</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div><div class="top-actions"><span class="today-label" id="today-label"></span><button class="icon-button mobile-preferences" data-action="settings" aria-label="Preferences" title="Preferences"><span data-icon="settings"></span></button><button class="icon-button" data-action="export" aria-label="Export data backup" title="Export data backup"><span data-icon="download"></span></button><button class="button primary small" data-action="log"><span data-icon="plus"></span><span id="log-label">Log session</span></button></div></header>
    <div id="mode-banner"></div>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>FORMA JOURNAL <span class="footer-dot">·</span> Progress is personal.</span><span>Skills. Endurance. Strength.</span></footer>
  </div>
  <dialog id="editor-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><div class="noscript">Enable JavaScript to use your training journal. Your data stays in your browser.</div></noscript>
</body>
</html>
